[project]
name = "tms-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "playwright>=1.58.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.26",
    "requests>=2.31.0",
    "textual>=0.61.1",
    "uvicorn>=0.35.0",
    "websocket-client>=1.8.0",
]

[tool.pytest.ini_options]
# Only run tests in tests/ directory, exclude tests/manual/
testpaths = ["tests"]
norecursedirs = ["manual", ".*", "build", "dist"]
